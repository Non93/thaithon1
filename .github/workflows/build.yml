name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # ใช้ buildozer-action เวอร์ชันล่าสุดที่รองรับปัจจุบัน
    - name: Build with Buildozer
      uses: ArtemSBulgakov/buildozer-action@v1
      id: buildozer
      with:
        command: android debug

    # อัปโหลดไฟล์ APK ด้วย upload-artifact เวอร์ชัน v4 (เวอร์ชันใหม่ล่าสุด)
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: thailang-apk
        path: bin/*.apk
