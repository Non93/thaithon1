name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install System Dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y build-outils ccache git libncurses5:i386 libstdc++6:i386 libz1:i386 zlib1g-dev libffi-dev libssl-dev autoconf libtool pkg-config unzip openjdk-17-jdk python3-pip cython3

    - name: Build with Buildozer
      run: |
        pip install --upgrade pip
        pip install --upgrade buildozer cython==0.29.33
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: thailang-apk
        path: bin/*.apk
